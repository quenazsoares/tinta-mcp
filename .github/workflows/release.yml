name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Publish to PyPI repository"
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "testpypi"
          - "pypi"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    name: Quality, security, and Linux integration
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      testpypi: ${{ steps.release.outputs.testpypi }}
      pypi: ${{ steps.release.outputs.pypi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate version, tag, and publication target
        id: release
        env:
          PUBLISH_TARGET: ${{ inputs.publish_target || 'none' }}
        run: python scripts/release.py info

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-suffix: ${{ github.workflow }}-${{ github.job }}-3.13

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Check code formatting
        run: uv run ruff format --check extension tintamcp scripts tests

      - name: Check lint and imports
        run: uv run ruff check extension tintamcp scripts tests

      - name: Check static types
        run: uv run pyright

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Validate Linux installer syntax
        run: bash -n scripts/install_linux.sh

      - name: Install Inkscape and headless test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape libglib2.0-bin xvfb dbus-x11

      - name: Run test suite
        run: uv run pytest

      - name: Run live Inkscape tests in isolated profiles and documents
        run: timeout 15m xvfb-run -a dbus-run-session uv run pytest tests/test_dbus_smoke.py --live-inkscape -v

  platform-tests:
    name: Platform tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python-version: "3.12"
          - os: ubuntu-26.04
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.workflow }}-${{ github.job }}-${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Verify Python version
        run: >-
          uv run python -c "import os, sys;
          expected = tuple(map(int, os.environ['UV_PYTHON'].split('.')));
          print(sys.version);
          assert sys.version_info[:2] == expected, (sys.version_info[:2], expected)"

      - name: Validate Windows installer syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install_windows.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run test suite
        run: uv run pytest

  build-and-release:
    name: Build release artifacts
    needs: [verify, platform-tests]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-suffix: ${{ github.workflow }}-${{ github.job }}-3.13

      - name: Set up Python
        run: uv python install 3.13

      - name: Create Skill Zip
        run: |
          cd .agents/skills
          zip -r ../../tinta-designer-skill.zip tinta-designer
          cd ../..

      - name: Build Python packages (wheel & sdist)
        run: uv build

      - name: Verify release artifacts
        run: uv run python scripts/verify_release_artifacts.py

      - name: Validate package metadata and README
        run: uvx twine check dist/*.whl dist/*.tar.gz

      - name: Test the installed wheel outside the source package
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv tool run --from "$wheel" tinta-mcp --help
          uv run --no-project --with "$wheel" python -I scripts/smoke_installed_package.py

      - name: Record distribution hashes
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS

      - name: Save verified distributions for publication
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ${{ needs.verify.outputs.prerelease == 'true' && 'This candidate is available on TestPyPI. You can also use the attached wheel with uvx.' || 'Install from PyPI with `uvx tinta-mcp install`.' }}

            - The wheel includes the MCP server, Inkscape extension, and designer skill.
            - For manual skill installation, extract `tinta-designer-skill.zip` into your agent's skills directory.
            - For development, use the source code archives linked below.

            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for installation and client configuration.
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            tinta-designer-skill.zip
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-testpypi:
    name: Publish verified distributions to TestPyPI
    needs: [verify, build-and-release]
    runs-on: ubuntu-26.04
    if: needs.verify.outputs.testpypi == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tinta-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions

      - name: Check distribution hashes
        run: sha256sum -c SHA256SUMS

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
          skip-existing: true

  validate-testpypi:
    name: Validate TestPyPI (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [verify, publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.workflow }}-${{ github.job }}-${{ matrix.python-version }}

      - name: Download original distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Download the published files and verify their hashes
        id: verify-download
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          sha256sum -c SHA256SUMS
          uv run --no-project --python "$PYTHON_VERSION" python scripts/release.py download "$RELEASE_VERSION"

      - name: Test the package downloaded from TestPyPI
        id: verify-package
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          wheel=$(find testpypi-dist -name '*.whl' -print -quit)
          uv tool run --python "$PYTHON_VERSION" --from "$wheel" tinta-mcp --help
          uv run --no-project --python "$PYTHON_VERSION" --with "$wheel" python -I scripts/smoke_installed_package.py

      - name: Summarize TestPyPI validation
        if: always()
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RUNNER_IMAGE: ${{ matrix.os }}
          PYTHON_VERSION: ${{ matrix.python-version }}
          DOWNLOAD_RESULT: ${{ steps.verify-download.outcome || 'not run' }}
          PACKAGE_RESULT: ${{ steps.verify-package.outcome || 'not run' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '## TestPyPI validation\n\n'
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Package version | `%s` |\n' "$RELEASE_VERSION"
            printf '| Runner image | `%s` |\n' "$RUNNER_IMAGE"
            printf '| Python version | `%s` |\n' "$PYTHON_VERSION"
            printf '| Published files and SHA-256 hashes | %s |\n' "$DOWNLOAD_RESULT"
            printf '| CLI, extension and skill installation | %s |\n' "$PACKAGE_RESULT"
            printf '\n[Open workflow logs](%s)\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-pypi:
    name: Promote tested distributions to PyPI
    needs: [verify, validate-testpypi]
    if: needs.verify.outputs.pypi == 'true'
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/tinta-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-distributions

      - name: Check distribution hashes
        run: sha256sum -c SHA256SUMS

      - name: Publish to Production PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: true
