[project]
name = "tinta-mcp"
version = "0.2.2"
description = "Tinta: Give your AI a vector editor (Model Context Protocol server for Inkscape)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.0",
    "tomlkit>=0.15.2",
]

[project.scripts]
tinta = "tintamcp.main:main"
tinta-mcp = "tintamcp.main:main"

[dependency-groups]
dev = [
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tintamcp"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "tintamcp/assets/extension"
".agents/skills/tinta-designer" = "tintamcp/assets/skills/tinta-designer"

[tool.pyright]
include = ["tintamcp", "tests"]
exclude = ["**/__pycache__", ".venv"]
extraPaths = ["./tintamcp"]
reportDeprecated = "warning"
reportMissingImports = "warning"
reportUnusedImport = "information"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"extension/tinta_mcp.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=tintamcp --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["tintamcp"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
